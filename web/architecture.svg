<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" role="img" aria-labelledby="title desc">
<title id="title">Commerce Trust Lab: Gemini-first architecture</title>
<desc id="desc">The browser and Flutter clients send an explicit request to a shared server. A supported-intent parser runs before Gemini call one generates a search_catalog tool call. The server validates exact constraints, retrieves products and offers from memory or Firestore, filters policy failures, and sends only eligible evidence to Gemini call two. It validates the selected offer, renders factual text, and stores a ten-minute proposal. A separate approved action revalidates the records and creates or replays one draft. Credentials stay server-side; no payment or inventory reservation occurs.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#4285F4"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#188038"/></marker>
