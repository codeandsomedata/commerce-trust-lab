text{font-family:Arial,Helvetica,sans-serif;fill:#202124} .title{font-size:42px;font-weight:700;letter-spacing:-1px}.subtitle{font-size:21px;fill:#5F6368}.section{font-size:17px;font-weight:700;letter-spacing:1.4px}.heading{font-size:21px;font-weight:700}.body{font-size:17px;fill:#3C4043}.small{font-size:15px;fill:#5F6368}.label{font-size:15px;fill:#1967D2;font-weight:700}.num{font-size:16px;font-weight:700;fill:#1967D2}.mono{font-family:monospace;font-size:16px;fill:#3C4043}
</style>
</defs>
